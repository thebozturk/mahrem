[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/thebozturk/mahrem"
homepage = "https://github.com/thebozturk/mahrem"
authors = ["Buğrahan Öztürk"]
keywords = ["pii", "turkish", "kvkk", "pseudonymization", "llm"]
categories = ["text-processing"]

[workspace.dependencies]
mahrem-core = { path = "crates/mahrem-core", version = "0.0.1" }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
proptest = "1.12"
reqwest = { version = "0.13.5", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
