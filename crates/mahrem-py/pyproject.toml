[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mahrem"
description = "Türkçe metindeki kişisel verileri LLM'e gitmeden maskeler"
readme = "../../README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Natural Language :: Turkish",
]

[project.urls]
Repository = "https://github.com/thebozturk/mahrem"

[tool.maturin]
module-name = "mahrem._mahrem"
python-source = "python"
features = ["pyo3/extension-module"]
